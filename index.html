<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Λέξη-Κλειδί</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: one phone-first reading column; a card page opens with the same colour band as the printed card. */
:root{
  --bg:#EEF2F7;
  --surface:#FFFFFF;
  --tint:#F4F6FA;
  --fg:#17203B;
  --soft:#4E5873;
  --line:#DDE3EC;
  --grid:#DCE3EC;
  --phys:#2346C8; --phys-ink:#2346C8;
  --chem:#C2296A; --chem-ink:#B0215E;
  --bio:#1E8549;  --bio-ink:#1B7A42;
  --on-band:#FFFFFF;
  --ok:#1E8549; --ok-bg:#E8F5EC;
  --bad:#C0392B; --bad-bg:#FBEBE9;
  --font:"Commissioner","Noto Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1528; --surface:#161E36; --tint:#1B2440;
    --fg:#E7EBF5; --soft:#A2ACC4; --line:#28324F; --grid:#18213B;
    --phys:#2E52D6; --phys-ink:#93A9FF;
    --chem:#B8255F; --chem-ink:#FF8FBC;
    --bio:#1D7D45;  --bio-ink:#73D49C;
    --on-band:#FFFFFF;
    --ok:#5CC98A; --ok-bg:#163526;
    --bad:#FF7F6E; --bad-bg:#3A1C1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1528; --surface:#161E36; --tint:#1B2440;
  --fg:#E7EBF5; --soft:#A2ACC4; --line:#28324F; --grid:#18213B;
  --phys:#2E52D6; --phys-ink:#93A9FF;
  --chem:#B8255F; --chem-ink:#FF8FBC;
  --bio:#1D7D45;  --bio-ink:#73D49C;
  --on-band:#FFFFFF;
  --ok:#5CC98A; --ok-bg:#163526;
  --bad:#FF7F6E; --bad-bg:#3A1C1A;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:var(--font);
  font-size:16px;
  line-height:1.55;
  color:var(--fg);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--phys-ink);outline-offset:3px;border-radius:4px}

.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 56px}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand{font-weight:900;font-size:19px;letter-spacing:-0.02em;text-decoration:none}
.all{font-size:14px;font-weight:600;color:var(--soft);text-decoration:none;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface)}

/* card page */
.sheet{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 1px 0 rgba(23,32,59,.06),0 10px 24px -14px rgba(23,32,59,.35)}
.band{background:var(--c);color:var(--on-band);padding:22px 20px 26px}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:600}
.tags span{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px}
.band h1{font-size:clamp(34px,10vw,46px);font-weight:900;letter-spacing:-0.025em;line-height:1.02;margin:16px 0 8px;text-wrap:balance}
.band h1:focus{outline:none}
.en{margin:0;font-size:14px;opacity:.92}

.sec{padding:20px;border-bottom:1px solid var(--line)}
.sec:last-of-type{border-bottom:0}
.sec h2{font-size:15px;font-weight:800;margin:0 0 6px;color:var(--ci)}
.sec p{margin:0;max-width:62ch}
.sec p + p{margin-top:10px}
.sec.fact{background:var(--tint)}

.root{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:8px;background:var(--c);color:var(--on-band);font-weight:800;font-size:15px}
.branch{list-style:none;margin:0 0 0 16px;padding:4px 0 0}
.branch li{position:relative;padding:8px 0 8px 24px}
.branch li::before{content:"";position:absolute;left:0;top:20px;width:16px;height:2px;background:var(--c)}
.branch li::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c)}
.branch li:last-child::after{bottom:auto;height:21px}
.branch strong{display:block}
.branch span{display:block;font-size:15px;line-height:1.45;color:var(--soft)}

.tag{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:800;color:var(--surface);vertical-align:2px}
.tag.bad{background:var(--bad)}
.tag.ok{background:var(--ok)}

.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;width:100%;font:inherit;font-size:15px;text-align:left;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.opt b{color:var(--ci)}
.opt:hover:not(:disabled){border-color:var(--ci)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.feedback{margin-top:12px !important;font-size:15px}
.feedback strong{margin-right:4px}

.next{display:flex;justify-content:center;padding-block:24px 0}

/* index */
.intro h1{font-size:clamp(44px,13vw,72px);font-weight:900;letter-spacing:-0.035em;line-height:.95;margin:20px 0 12px}
.intro p{margin:0;max-width:52ch;font-size:17px}
.notice{margin-top:14px !important;padding:10px 14px;border-radius:10px;background:var(--bad-bg);color:var(--fg);font-size:15px !important}
.group{margin-top:32px}
.group h2{font-size:22px;font-weight:800;margin:0 0 4px;color:var(--ci)}
.lvl{font-size:14px;font-weight:700;color:var(--soft);margin:14px 0 8px}
.lvl .dots{letter-spacing:-1px;margin-right:6px;color:var(--ci);font-size:11px}
.words{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.words a{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);text-decoration:none;font-weight:700;min-width:0}
.words a:hover{border-color:var(--ci)}
.words .code{font-size:12px;font-weight:600;color:var(--soft);font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}
</style>

<div class="wrap" id="app"></div>

<script>
const CARDS = [{"id": "F1-01", "sci": "phys", "lvl": 1, "word": "Μαγνήτης", "en": "magnet", "taboo": [{"word": "σίδερο", "why": "Ο μαγνήτης τραβάει κυρίως αντικείμενα από σίδηρο (και λίγα άλλα μέταλλα, όπως το νικέλιο)."}, {"word": "έλκει", "why": "«Έλκει» σημαίνει τραβάει κοντά του: αυτό ακριβώς κάνει ο μαγνήτης."}, {"word": "πόλος", "why": "Κάθε μαγνήτης έχει δύο πόλους, τον βόρειο και τον νότιο."}, {"word": "ψυγείο", "why": "Το πιο γνωστό μέρος όπου κολλάμε μαγνητάκια."}, {"word": "πυξίδα", "why": "Η βελόνα της πυξίδας είναι ένας μικρός μαγνήτης."}], "def": "Σώμα που τραβάει (έλκει) αντικείμενα φτιαγμένα από σίδηρο και μερικά άλλα μέταλλα, όπως το νικέλιο και το κοβάλτιο. Κάθε μαγνήτης έχει δύο άκρα, τους πόλους: τον βόρειο και τον νότιο. Δύο ίδιοι πόλοι σπρώχνουν ο ένας τον άλλον (απωθούνται), ενώ δύο διαφορετικοί τραβιούνται (έλκονται).", "ex": "Τα μαγνητάκια στην πόρτα του ψυγείου, το κούμπωμα σε κάποιες τσάντες και κασετίνες, η βελόνα της πυξίδας.", "myth": {"wrong": "«Ο μαγνήτης τραβάει όλα τα μέταλλα.»", "right": "Όχι. Το αλουμίνιο (π.χ. ένα κουτάκι αναψυκτικού), ο χαλκός και το χρυσάφι δεν κολλάνε σε μαγνήτη."}, "fact": "Η ίδια η Γη συμπεριφέρεται σαν ένας τεράστιος μαγνήτης. Γι’ αυτό η βελόνα της πυξίδας γυρίζει πάντα προς τον βορρά.", "quiz": {"q": "Ποιο από αυτά θα κολλήσει σε έναν μαγνήτη;", "a": ["Ένα κουτάκι αναψυκτικού από αλουμίνιο", "Ένα σιδερένιο καρφί", "Ένα ξύλινο μολύβι"], "c": 1, "why": "Μόνο το σιδερένιο καρφί. Το αλουμίνιο είναι μέταλλο, αλλά δεν έλκεται από τον μαγνήτη."}}, {"id": "F1-02", "sci": "phys", "lvl": 1, "word": "Βαρύτητα", "en": "gravity", "taboo": [{"word": "πέφτω", "why": "Όταν αφήνουμε κάτι, πέφτει κάτω εξαιτίας της βαρύτητας."}, {"word": "Γη", "why": "Η Γη τραβάει τα πάντα προς το κέντρο της."}, {"word": "Νεύτωνας", "why": "Ο Ισαάκ Νεύτωνας ήταν ο πρώτος που περιέγραψε τη βαρύτητα με νόμο."}, {"word": "μήλο", "why": "Λέγεται ότι ο Νεύτωνας σκέφτηκε τη βαρύτητα βλέποντας ένα μήλο να πέφτει."}, {"word": "βάρος", "why": "Το βάρος μας είναι η δύναμη με την οποία μας τραβάει η Γη."}], "def": "Η δύναμη με την οποία η Γη τραβάει τα σώματα προς το κέντρο της. Εξαιτίας της, όταν αφήνουμε κάτι, πέφτει στο έδαφος, και εμείς δεν «πετάμε» στον αέρα. Βαρύτητα δεν έχει μόνο η Γη: κάθε σώμα τραβάει τα άλλα σώματα, όπως ο Ήλιος τραβάει τους πλανήτες.", "ex": "Μια μπάλα που την πετάς ψηλά ξαναπέφτει κάτω. Η Σελήνη γυρίζει γύρω από τη Γη επειδή την κρατάει η βαρύτητα.", "myth": {"wrong": "«Στο διάστημα δεν υπάρχει βαρύτητα.»", "right": "Υπάρχει! Οι αστροναύτες στον Διεθνή Διαστημικό Σταθμό αιωρούνται επειδή «πέφτουν» συνεχώς γύρω από τη Γη μαζί με τον σταθμό, όχι επειδή χάθηκε η βαρύτητα."}, "fact": "Στη Σελήνη η βαρύτητα είναι περίπου 6 φορές πιο αδύναμη από ό,τι στη Γη. Εκεί θα πηδούσες πολύ πιο ψηλά!", "quiz": {"q": "Γιατί η μπάλα που κλοτσάς ψηλά ξαναπέφτει;", "a": ["Επειδή τη σπρώχνει ο αέρας προς τα κάτω", "Επειδή την τραβάει η Γη", "Επειδή κουράζεται"], "c": 1, "why": "Η Γη τραβάει συνεχώς τη μπάλα προς το μέρος της, γι’ αυτό κάποια στιγμή σταματάει να ανεβαίνει και ξαναπέφτει."}}, {"id": "F1-03", "sci": "phys", "lvl": 1, "word": "Ουράνιο τόξο", "en": "rainbow", "taboo": [{"word": "χρώματα", "why": "Το ουράνιο τόξο είναι μια σειρά από χρώματα στον ουρανό."}, {"word": "βροχή", "why": "Συνήθως το βλέπουμε την ώρα που βρέχει ή λίγο μετά."}, {"word": "ήλιος", "why": "Χρειάζεται το φως του ήλιου για να σχηματιστεί."}, {"word": "σταγόνες", "why": "Οι σταγόνες του νερού χωρίζουν το φως στα χρώματά του."}, {"word": "καμάρα", "why": "Έχει σχήμα καμάρας στον ουρανό."}], "def": "Ένα πολύχρωμο τόξο που εμφανίζεται στον ουρανό όταν το φως του ήλιου περνάει μέσα από σταγόνες νερού. Το λευκό φως του ήλιου είναι στην πραγματικότητα μείγμα από πολλά χρώματα. Μέσα στις σταγόνες το φως λυγίζει (διαθλάται) και τα χρώματα χωρίζονται μεταξύ τους.", "ex": "Ένα απόγευμα με ήλιο μετά από μπόρα, ή όταν ποτίζεις τον κήπο με το λάστιχο έχοντας τον ήλιο πίσω σου.", "myth": {"wrong": "«Το ουράνιο τόξο έχει ακριβώς 7 χρώματα.»", "right": "Τα χρώματα αλλάζουν σιγά σιγά το ένα στο άλλο, χωρίς σύνορα. Τα 7 χρώματα είναι μια συμφωνία που καθιέρωσε ο Νεύτωνας."}, "fact": "Για να δεις ουράνιο τόξο, ο ήλιος πρέπει να είναι πίσω σου. Από αεροπλάνο μπορεί να το δεις ολόκληρο, σαν κύκλο!", "quiz": {"q": "Τι χρειάζεται για να σχηματιστεί ουράνιο τόξο;", "a": ["Ήλιος και σταγόνες νερού", "Σύννεφα και άνεμος", "Φεγγάρι και αστέρια"], "c": 0, "why": "Το φως του ήλιου πρέπει να περάσει μέσα από σταγόνες νερού για να χωριστεί στα χρώματά του."}}, {"id": "F2-01", "sci": "phys", "lvl": 2, "word": "Τριβή", "en": "friction", "taboo": [{"word": "δύναμη", "why": "Η τριβή είναι δύναμη."}, {"word": "γλιστράω", "why": "Όταν η τριβή είναι μικρή, γλιστράμε, όπως στον πάγο."}, {"word": "επιφάνεια", "why": "Εμφανίζεται εκεί που ακουμπούν δύο επιφάνειες."}, {"word": "φρένο", "why": "Τα φρένα σταματούν ρόδες και οχήματα χάρη στην τριβή."}, {"word": "θερμότητα", "why": "Όταν τρίβονται δύο επιφάνειες, παράγεται θερμότητα."}], "def": "Η δύναμη που εμφανίζεται όταν δύο επιφάνειες ακουμπούν μεταξύ τους και η μία κινείται, ή προσπαθεί να κινηθεί, πάνω στην άλλη. Η τριβή έχει πάντα αντίθετη κατεύθυνση από το γλίστρημα, δηλαδή του «αντιστέκεται». Είναι μεγαλύτερη σε τραχιές επιφάνειες και μικρότερη σε λείες.", "ex": "Τα φρένα του ποδηλάτου σταματούν τη ρόδα με τριβή. Τρίβουμε τα χέρια μας για να ζεσταθούν. Οι αθλητές της γυμναστικής βάζουν μαγνησία στα χέρια για να μη γλιστράνε.", "myth": {"wrong": "«Η τριβή είναι πάντα κάτι κακό που μας εμποδίζει.»", "right": "Χωρίς τριβή δεν θα μπορούσαμε ούτε να περπατήσουμε: τα παπούτσια μας θα γλιστρούσαν σαν σε πάγο, και τα αυτοκίνητα δεν θα μπορούσαν ούτε να ξεκινήσουν ούτε να στρίψουν."}, "fact": "Το σπίρτο ανάβει χάρη στην τριβή: όταν το τρίβεις στο κουτί, η θερμότητα που παράγεται αρκεί για να πάρει φωτιά η κεφαλή του.", "quiz": {"q": "Σε ποια επιφάνεια η τριβή με τα παπούτσια σου είναι μικρότερη;", "a": ["Άσφαλτος", "Πάγος", "Χαλί"], "c": 1, "why": "Ο πάγος είναι πολύ λείος, γι’ αυτό η τριβή είναι μικρή και γλιστράμε εύκολα."}}, {"id": "F2-02", "sci": "phys", "lvl": 2, "word": "Πυκνότητα", "en": "density", "taboo": [{"word": "μάζα", "why": "Η πυκνότητα υπολογίζεται διαιρώντας τη μάζα με τον όγκο."}, {"word": "όγκος", "why": "Ο όγκος, ο χώρος που πιάνει ένα σώμα, είναι το άλλο μισό του τύπου."}, {"word": "επιπλέω", "why": "Ό,τι έχει μικρότερη πυκνότητα από ένα υγρό επιπλέει σε αυτό."}, {"word": "βαρύ", "why": "Τα πυκνά υλικά μάς φαίνονται «βαριά για το μέγεθός τους»."}, {"word": "νερό", "why": "Συγκρίνουμε συχνά την πυκνότητα ενός υλικού με του νερού για να δούμε αν επιπλέει."}], "def": "Δείχνει πόση μάζα υπάρχει σε έναν ορισμένο όγκο ενός υλικού, δηλαδή πόσο «στριμωγμένη» είναι η ύλη του. Υπολογίζεται με τον τύπο ρ = m / V (μάζα διά όγκο) και μετριέται σε g/cm³ ή kg/m³. Ένα σώμα επιπλέει σε ένα υγρό όταν η μέση πυκνότητά του είναι μικρότερη από την πυκνότητα του υγρού.", "ex": "Το λάδι μένει πάνω από το ξίδι στη σαλάτα. Ένα κιλό πούπουλα πιάνει πολύ περισσότερο χώρο από ένα κιλό σίδερο.", "myth": {"wrong": "«Τα βαριά αντικείμενα βουλιάζουν και τα ελαφριά επιπλέουν.»", "right": "Ένα πλοίο χιλιάδων τόνων επιπλέει, ενώ ένα μικρό βότσαλο βουλιάζει. Αυτό που μετράει είναι η πυκνότητα, όχι το βάρος."}, "fact": "Στη Νεκρή Θάλασσα επιπλέεις χωρίς καμία προσπάθεια: το νερό της έχει τόσο πολύ αλάτι που η πυκνότητά του ξεπερνά αρκετά την πυκνότητα του σώματός σου.", "quiz": {"q": "Ένα κομμάτι ξύλο επιπλέει στο νερό. Τι σημαίνει αυτό για την πυκνότητά του;", "a": ["Είναι μεγαλύτερη από του νερού", "Είναι μικρότερη από του νερού", "Είναι ίση με του νερού"], "c": 1, "why": "Ό,τι έχει μικρότερη πυκνότητα από ένα υγρό επιπλέει σε αυτό."}}, {"id": "F2-03", "sci": "phys", "lvl": 2, "word": "Ηλεκτρικό ρεύμα", "en": "electric current", "taboo": [{"word": "ηλεκτρόνια", "why": "Στα μεταλλικά καλώδια, το ρεύμα είναι κίνηση ηλεκτρονίων."}, {"word": "καλώδιο", "why": "Το ρεύμα κυκλοφορεί μέσα από τα καλώδια."}, {"word": "μπαταρία", "why": "Η μπαταρία είναι πηγή που κάνει το ρεύμα να κυκλοφορεί."}, {"word": "πρίζα", "why": "Από την πρίζα παίρνουν ρεύμα οι συσκευές του σπιτιού."}, {"word": "αμπέρ", "why": "Η μονάδα με την οποία μετράμε την ένταση του ρεύματος."}], "def": "Η προσανατολισμένη κίνηση ηλεκτρικών φορτίων, δηλαδή η κίνησή τους με συγκεκριμένη κατεύθυνση, μέσα σε ένα υλικό που το επιτρέπει (αγωγό). Στα μεταλλικά καλώδια, τα φορτία που κινούνται είναι τα ηλεκτρόνια. Για να κυκλοφορήσει ρεύμα χρειάζεται κλειστό κύκλωμα και μια πηγή, όπως μια μπαταρία. Η ένταση του ρεύματος μετριέται σε αμπέρ (A).", "ex": "Όταν πατάς τον διακόπτη, το κύκλωμα κλείνει, το ρεύμα φτάνει στη λάμπα και αυτή ανάβει.", "myth": {"wrong": "«Η μπαταρία είναι γεμάτη ρεύμα και, όταν αδειάσει, το ρεύμα τελείωσε.»", "right": "Η μπαταρία δεν αποθηκεύει ρεύμα αλλά χημική ενέργεια. Με αυτή την ενέργεια βάζει σε κίνηση τα φορτία που υπάρχουν ήδη μέσα στα καλώδια."}, "fact": "Τα ηλεκτρόνια μέσα σε ένα καλώδιο προχωράνε πιο αργά κι από σαλιγκάρι! Η λάμπα όμως ανάβει αμέσως, γιατί όλα τα ηλεκτρόνια του κυκλώματος αρχίζουν να κινούνται σχεδόν ταυτόχρονα.", "quiz": {"q": "Σε ποια μονάδα μετράμε την ένταση του ηλεκτρικού ρεύματος;", "a": ["Βολτ (V)", "Αμπέρ (A)", "Βατ (W)"], "c": 1, "why": "Το αμπέρ μετράει την ένταση του ρεύματος. Το βολτ μετράει την τάση και το βατ την ισχύ."}}, {"id": "C1-01", "sci": "chem", "lvl": 1, "word": "Διάλυση", "en": "dissolving", "taboo": [{"word": "νερό", "why": "Το πιο συνηθισμένο υγρό μέσα στο οποίο διαλύουμε πράγματα."}, {"word": "ζάχαρη", "why": "Το κλασικό παράδειγμα: η ζάχαρη στο τσάι."}, {"word": "αλάτι", "why": "Το αλάτι διαλύεται στο νερό των μακαρονιών."}, {"word": "ανακατεύω", "why": "Όταν ανακατεύουμε, η διάλυση γίνεται πιο γρήγορα."}, {"word": "λιώνω", "why": "Πολλοί λένε «η ζάχαρη λιώνει», αλλά το σωστό είναι «διαλύεται». Δες το συχνό λάθος πιο κάτω."}], "def": "Αυτό που συμβαίνει όταν ένα υλικό, όπως η ζάχαρη, ανακατεύεται με ένα υγρό, όπως το νερό, και «χάνεται» μέσα του. Η ζάχαρη δεν εξαφανίστηκε: τα μικροσκοπικά σωματίδιά της σκόρπισαν ανάμεσα στα σωματίδια του νερού. Το μείγμα που φτιάχνεται λέγεται διάλυμα.", "ex": "Η ζάχαρη στο τσάι, το αλάτι στο νερό των μακαρονιών, η σκόνη για χυμό μέσα στο νερό.", "myth": {"wrong": "«Η ζάχαρη λιώνει στο τσάι.»", "right": "Λιώνω (τήξη) σημαίνει ότι ένα στερεό γίνεται υγρό επειδή ζεστάθηκε, όπως το παγάκι ή η σοκολάτα στον ήλιο. Η ζάχαρη στο τσάι δεν λιώνει, διαλύεται."}, "fact": "Αν αφήσεις αλατόνερο στον ήλιο, το νερό εξατμίζεται και το αλάτι μένει πίσω. Έτσι μαζεύουμε αλάτι από τη θάλασσα στις αλυκές.", "quiz": {"q": "Ποιο από αυτά ΔΕΝ διαλύεται στο νερό;", "a": ["Ζάχαρη", "Αλάτι", "Άμμος"], "c": 2, "why": "Η άμμος, όσο κι αν την ανακατέψεις, κάθεται στον πάτο. Η ζάχαρη και το αλάτι διαλύονται."}}, {"id": "C1-02", "sci": "chem", "lvl": 1, "word": "Καύση", "en": "combustion", "taboo": [{"word": "φωτιά", "why": "Η φωτιά είναι αυτό που βλέπουμε όταν γίνεται καύση."}, {"word": "καίω", "why": "Είναι το ρήμα της ίδιας λέξης."}, {"word": "οξυγόνο", "why": "Χωρίς το οξυγόνο του αέρα δεν μπορεί να γίνει καύση."}, {"word": "φλόγα", "why": "Η φλόγα είναι τα καυτά αέρια που λάμπουν κατά την καύση."}, {"word": "καπνός", "why": "Ο καπνός βγαίνει από πολλές καύσεις, όπως του ξύλου."}], "def": "Μια χημική αντίδραση κατά την οποία ένα υλικό (το καύσιμο) ενώνεται με το οξυγόνο του αέρα και ελευθερώνει θερμότητα και συνήθως φως. Για να γίνει χρειάζονται τρία πράγματα μαζί: καύσιμο, οξυγόνο και αρκετά υψηλή θερμοκρασία. Αν λείψει ένα από τα τρία, η φωτιά σβήνει.", "ex": "Ένα αναμμένο κερί, τα ξύλα στο τζάκι, το γκάζι στην κουζίνα, η βενζίνη στη μηχανή του αυτοκινήτου.", "myth": {"wrong": "«Όταν καίγεται ένα ξύλο, το μεγαλύτερο μέρος του εξαφανίζεται.»", "right": "Τίποτα δεν εξαφανίζεται. Το μεγαλύτερο μέρος του ξύλου γίνεται αέρια, διοξείδιο του άνθρακα και υδρατμοί, που φεύγουν στον αέρα, και μένει λίγη στάχτη."}, "fact": "Αν σκεπάσεις ένα αναμμένο κεράκι με ένα γυάλινο βάζο, σε λίγο σβήνει, γιατί τελειώνει το οξυγόνο μέσα στο βάζο. Δοκιμάστε το μόνο μαζί με έναν μεγάλο!", "quiz": {"q": "Τι χρειάζεται μια φωτιά για να συνεχίσει να καίει;", "a": ["Νερό", "Οξυγόνο", "Σκοτάδι"], "c": 1, "why": "Χωρίς οξυγόνο η καύση σταματάει. Γι’ αυτό σβήνουμε μια μικρή φωτιά σκεπάζοντάς την με κουβέρτα πυρόσβεσης."}}, {"id": "C1-03", "sci": "chem", "lvl": 1, "word": "Μείγμα", "en": "mixture", "taboo": [{"word": "ανακατεύω", "why": "Φτιάχνουμε ένα μείγμα ανακατεύοντας υλικά."}, {"word": "υλικά", "why": "Ένα μείγμα έχει τουλάχιστον δύο διαφορετικά υλικά."}, {"word": "σαλάτα", "why": "Η σαλάτα είναι μείγμα που φαίνεται με το μάτι."}, {"word": "ξεχωρίζω", "why": "Τα υλικά ενός μείγματος μπορούμε να τα ξεχωρίσουμε ξανά."}, {"word": "καθαρό", "why": "Το αντίθετο του μείγματος είναι η καθαρή ουσία."}], "def": "Ένα υλικό που αποτελείται από δύο ή περισσότερα διαφορετικά υλικά ανακατεμένα μεταξύ τους. Κάθε υλικό κρατάει τις ιδιότητές του, και μπορούμε να τα ξεχωρίσουμε ξανά, για παράδειγμα με κόσκινο, με φιλτράρισμα ή με εξάτμιση.", "ex": "Η σαλάτα, το θαλασσινό νερό, το χώμα, ακόμα και ο αέρας που αναπνέουμε.", "myth": {"wrong": "«Αν δεν βλέπω διαφορετικά κομμάτια, δεν είναι μείγμα.»", "right": "Το αλατόνερο και ο αέρας μοιάζουν με ένα μόνο υλικό, κι όμως είναι μείγματα. Τέτοια μείγματα λέγονται ομογενή."}, "fact": "Ο αέρας είναι μείγμα αερίων: περίπου 78% άζωτο, 21% οξυγόνο και 1% άλλα αέρια.", "quiz": {"q": "Ποιο από αυτά είναι μείγμα;", "a": ["Οξυγόνο", "Θαλασσινό νερό", "Διαμάντι"], "c": 1, "why": "Το θαλασσινό νερό έχει νερό, αλάτι και άλλες ουσίες. Το οξυγόνο και το διαμάντι (άνθρακας) είναι καθαρές ουσίες."}}, {"id": "C2-01", "sci": "chem", "lvl": 2, "word": "Άτομο", "en": "atom", "taboo": [{"word": "μικρό", "why": "Το άτομο είναι απίστευτα μικρό· δεν φαίνεται ούτε με κοινό μικροσκόπιο."}, {"word": "πυρήνας", "why": "Στο κέντρο του ατόμου βρίσκεται ο πυρήνας."}, {"word": "ηλεκτρόνια", "why": "Τα ηλεκτρόνια κινούνται γύρω από τον πυρήνα."}, {"word": "στοιχείο", "why": "Κάθε χημικό στοιχείο αποτελείται από ένα είδος ατόμων."}, {"word": "Δημόκριτος", "why": "Ο Έλληνας φιλόσοφος που, μαζί με τον δάσκαλό του τον Λεύκιππο, μίλησε πρώτος για άτομα πριν από περίπου 2.400 χρόνια."}], "def": "Το μικρότερο σωματίδιο ενός χημικού στοιχείου που έχει ακόμα τις ιδιότητες του στοιχείου. Αποτελείται από έναν μικροσκοπικό πυρήνα στο κέντρο, που περιέχει πρωτόνια και νετρόνια, και από ηλεκτρόνια που κινούνται γύρω του. Η λέξη σημαίνει «αυτό που δεν κόβεται» (α- + τέμνω).", "ex": "Ένα φύλλο αλουμινόχαρτο αποτελείται από δισεκατομμύρια δισεκατομμυρίων άτομα αλουμινίου.", "myth": {"wrong": "«Τα ηλεκτρόνια γυρίζουν γύρω από τον πυρήνα σε τροχιές, σαν τους πλανήτες γύρω από τον Ήλιο.»", "right": "Αυτή είναι μια απλοποιημένη εικόνα. Στην πραγματικότητα τα ηλεκτρόνια βρίσκονται σε περιοχές γύρω από τον πυρήνα που μοιάζουν με «σύννεφα»."}, "fact": "Το άτομο είναι σχεδόν ολόκληρο άδειο. Αν ο πυρήνας είχε το μέγεθος ενός μυρμηγκιού στο κέντρο ενός γηπέδου, τα ηλεκτρόνια θα βρίσκονταν κάπου στις κερκίδες.", "quiz": {"q": "Τι υπάρχει μέσα στον πυρήνα του ατόμου;", "a": ["Πρωτόνια και νετρόνια", "Μόνο ηλεκτρόνια", "Μόρια"], "c": 0, "why": "Ο πυρήνας περιέχει πρωτόνια και νετρόνια. Τα ηλεκτρόνια βρίσκονται έξω από αυτόν."}}, {"id": "C2-02", "sci": "chem", "lvl": 2, "word": "Οξύ", "en": "acid", "taboo": [{"word": "ξινό", "why": "Τα οξέα έχουν ξινή γεύση."}, {"word": "λεμόνι", "why": "Ο χυμός λεμονιού περιέχει κιτρικό οξύ."}, {"word": "pH", "why": "Τα διαλύματα των οξέων έχουν pH μικρότερο από 7."}, {"word": "βάση", "why": "Η βάση είναι το «αντίθετο» του οξέος· όταν αναμειγνύονται, εξουδετερώνει η μία την άλλη."}, {"word": "διαβρωτικό", "why": "Τα ισχυρά οξέα μπορούν να «φάνε» (διαβρώσουν) μέταλλα και να κάψουν το δέρμα."}], "def": "Μια ουσία που, όταν διαλυθεί στο νερό, ελευθερώνει ιόντα υδρογόνου (H⁺). Τα διαλύματα των οξέων έχουν pH μικρότερο από 7, ξινή γεύση και αλλάζουν το χρώμα των δεικτών: για παράδειγμα, κάνουν κόκκινο το μπλε χαρτί ηλιοτροπίου.", "ex": "Ο χυμός λεμονιού (κιτρικό οξύ), το ξίδι (οξικό οξύ), το γιαούρτι (γαλακτικό οξύ), το υγρό στο στομάχι μας (υδροχλωρικό οξύ).", "myth": {"wrong": "«Όλα τα οξέα είναι επικίνδυνα και καίνε.»", "right": "Τρώμε οξέα κάθε μέρα, στο λεμόνι, στο ξίδι και στο γιαούρτι. Επικίνδυνα είναι τα ισχυρά και πυκνά οξέα του εργαστηρίου. Ποτέ μη δοκιμάζεις άγνωστες ουσίες!"}, "fact": "Το στομάχι σου φτιάχνει υδροχλωρικό οξύ, που βοηθάει στη χώνεψη και σκοτώνει μικρόβια. Ένα στρώμα βλέννας προστατεύει τα τοιχώματά του, για να μη «χωνέψει» τον εαυτό του.", "quiz": {"q": "Ένα διάλυμα έχει pH = 3. Τι είναι;", "a": ["Όξινο", "Ουδέτερο", "Βασικό"], "c": 0, "why": "pH κάτω από 7 σημαίνει όξινο, ακριβώς 7 ουδέτερο, πάνω από 7 βασικό."}}, {"id": "C2-03", "sci": "chem", "lvl": 2, "word": "Μόριο", "en": "molecule", "taboo": [{"word": "άτομα", "why": "Κάθε μόριο φτιάχνεται από άτομα."}, {"word": "ενώνω", "why": "Στο μόριο τα άτομα είναι ενωμένα με χημικούς δεσμούς."}, {"word": "νερό", "why": "Το μόριο του νερού (H₂O) είναι το πιο γνωστό παράδειγμα."}, {"word": "μικρό", "why": "Τα μόρια δεν φαίνονται με γυμνό μάτι."}, {"word": "ουσία", "why": "Το μόριο είναι το μικρότερο κομμάτι μιας ουσίας που έχει τις ιδιότητές της."}], "def": "Το μικρότερο σωματίδιο μιας ουσίας που έχει ακόμα τις χημικές ιδιότητές της. Αποτελείται από δύο ή περισσότερα άτομα που συνδέονται μεταξύ τους με χημικούς δεσμούς. Τα άτομα μπορεί να είναι ίδια, όπως στο οξυγόνο (O₂), ή διαφορετικά, όπως στο νερό (H₂O).", "ex": "Το μόριο του νερού έχει 2 άτομα υδρογόνου και 1 άτομο οξυγόνου. Το διοξείδιο του άνθρακα (CO₂) που εκπνέουμε έχει 1 άτομο άνθρακα και 2 άτομα οξυγόνου.", "myth": {"wrong": "«Τα μόρια του πάγου είναι διαφορετικά από τα μόρια του νερού.»", "right": "Είναι ακριβώς τα ίδια μόρια H₂O. Αλλάζει μόνο το πόσο κοντά βρίσκονται και πόσο ελεύθερα κινούνται."}, "fact": "Μια σταγόνα νερού περιέχει πάνω από 1.000.000.000.000.000.000.000 μόρια: ένα 1 ακολουθούμενο από 21 μηδενικά!", "quiz": {"q": "Από πόσα άτομα αποτελείται ένα μόριο νερού (H₂O);", "a": ["2", "3", "4"], "c": 1, "why": "2 άτομα υδ λη αλλαγή στη μορφή του σώματος που περνάνε κάποια ζώα καθώς μεγαλώνουν, τόσο μεγάλη που το μικρό δεν μοιάζει καθόλου με το ενήλικο. Η πεταλούδα περνάει τέσσερα στάδια: αυγό, κάμπια (προνύμφη), χρυσαλλίδα (νύμφη) και τέλος πεταλούδα.", "ex": "Ο γυρίνος ζει στο νερό και αναπνέει με βράγχια. Σιγά σιγά βγάζει πόδια, χάνει την ουρά του και γίνεται βάτραχος που ζει και στη στεριά.", "myth": {"wrong": "«Οι πεταλούδες βγαίνουν από κουκούλι.»", "right": "Οι πεταλούδες σχηματίζουν χρυσαλλίδα, που δεν είναι πλεγμένη από μετάξι: είναι το ίδιο το σώμα της κάμπιας, που σκληραίνει απέξω. Κουκούλι από μετάξι φτιάχνουν κυρίως οι νυχτοπεταλούδες, όπως ο μεταξοσκώληκας."}, "fact": "Μέσα στη χρυσαλλίδα, το σώμα της κάμπιας σχεδόν διαλύεται και ξαναχτίζεται από την αρχή σε σώμα πεταλούδας.", "quiz": {"q": "Πώς λέγεται το μικρό του βατράχου;", "a": ["Γυρίνος", "Κάμπια", "Χρυσαλλίδα"], "c": 0, "why": "Ο γυρίνος είναι το στάδιο του βατράχου μετά το αυγό. Η κάμπια και η χρυσαλλίδα είναι στάδια της πεταλούδας."}}, {"id": "B1-03", "sci": "bio", "lvl": 1, "word": "Σκελετός", "en": "skeleton", "taboo": [{"word": "κόκαλα", "why": "Ο σκελετός αποτελείται από τα κόκαλα (οστά) του σώματος."}, {"word": "κρανίο", "why": "Το κρανίο είναι το μέρος του σκελετού που προστατεύει τον εγκέφαλο."}, {"word": "στήριξη", "why": "Ο σκελετός στηρίζει το σώμα, όπως ο σκελετός ενός κτιρίου."}, {"word": "σπονδυλική", "why": "Η σπονδυλική στήλη είναι ο «άξονας» του σκελετού."}, {"word": "ακτινογραφία", "why": "Με την ακτινογραφία βλέπουμε τα κόκαλα μέσα από το σώμα."}], "def": "Το σύνολο των οστών (κοκάλων) του σώματος. Ο σκελετός στηρίζει το σώμα και του δίνει σχήμα, προστατεύει σημαντικά όργανα (το κρανίο τον εγκέφαλο, τα πλευρά την καρδιά και τους πνεύμονες) και, μαζί με τους μύες, μάς επιτρέπει να κινούμαστε.", "ex": "Όταν κάποιος σπάσει το χέρι του, ο γιατρός βλέπει το κόκαλο με ακτινογραφία και το ακινητοποιεί με γύψο μέχρι να κολλήσει.", "myth": {"wrong": "«Τα κόκαλα είναι νεκρά και σκληρά σαν πέτρα.»", "right": "Τα οστά είναι ζωντανά: έχουν αιμοφόρα αγγεία και νεύρα, μεγαλώνουν μαζί μας και, όταν σπάσουν, επουλώνονται."}, "fact": "Ένας ενήλικας έχει 206 οστά, ενώ ένα μωρό γεννιέται με περίπου 300. Καθώς μεγαλώνουμε, κάποια από αυτά ενώνονται μεταξύ τους.", "quiz": {"q": "Ποιο όργανο προστατεύει το κρανίο;", "a": ["Την καρδιά", "Τον εγκέφαλο", "Το στομάχι"], "c": 1, "why": "Το κρανίο είναι σαν κράνος για τον εγκέφαλο. Την καρδιά την προστατεύουν τα πλευρά."}}, {"id": "B2-01", "sci": "bio", "lvl": 2, "word": "Κύτταρο", "en": "cell", "taboo": [{"word": "μικρό", "why": "Τα περισσότερα κύτταρα φαίνονται μόνο με μικροσκόπιο."}, {"word": "μονάδα", "why": "Το κύτταρο είναι η βασική μονάδα της ζωής."}, {"word": "πυρήνας", "why": "Ο πυρήνας είναι το «κέντρο ελέγχου» πολλών κυττάρων."}, {"word": "μικροσκόπιο", "why": "Τα κύτταρα ανακαλύφθηκαν με το μικροσκόπιο."}, {"word": "οργανισμός", "why": "Κάθε ζωντανός οργανισμός αποτελείται από κύτταρα."}], "def": "Η μικρότερη μονάδα της ζωής. Όλοι οι ζωντανοί οργανισμοί αποτελούνται από ένα ή περισσότερα κύτταρα. Κάθε κύτταρο περιβάλλεται από μια λεπτή μεμβράνη, είναι γεμάτο κυτταρόπλασμα και περιέχει γενετικό υλικό (DNA). Στα κύτταρα των ζώων και των φυτών, το DNA βρίσκεται μέσα στον πυρήνα.", "ex": "Τα βακτήρια είναι οργανισμοί με ένα μόνο κύτταρο. Το ανθρώπινο σώμα αποτελείται από δεκάδες τρισεκατομμύρια κύτταρα.", "myth": {"wrong": "«Όλα τα κύτταρα έχουν πυρήνα.»", "right": "Τα βακτήρια δεν έχουν πυρήνα. Ούτε τα ώριμα ερυθρά αιμοσφαίρια του αίματός μας."}, "fact": "Ο Ρόμπερτ Χουκ είδε και ονόμασε πρώτος κύτταρα, το 1665. Κοίταξε στο μικροσκόπιο ένα κομματάκι φελλό και είδε μικρά «δωμάτια» που του θύμισαν κελιά μοναχών. Γι’ αυτό στα αγγλικά λέγονται cells (κελιά).", "quiz": {"q": "Ποιοι από αυτούς τους οργανισμούς έχουν ένα μόνο κύτταρο;", "a": ["Τα βακτήρια", "Τα δέντρα", "Τα ψάρια"], "c": 0, "why": "Τα βακτήρια είναι μονοκύτταροι οργανισμοί. Τα δέντρα και τα ψάρια έχουν δισεκατομμύρια κύτταρα."}}, {"id": "B2-02", "sci": "bio", "lvl": 2, "word": "DNA", "en": "DNA (deoxyribonucleic acid)", "taboo": [{"word": "γονίδια", "why": "Τα γονίδια είναι κομμάτια του DNA."}, {"word": "κληρονομικότητα", "why": "Το DNA είναι η βάση της κληρονομικότητας."}, {"word": "έλικα", "why": "Το DNA έχει σχήμα διπλής έλικας."}, {"word": "χρωμοσώματα", "why": "Το DNA είναι «πακεταρισμένο» μέσα στα χρωμοσώματα."}, {"word": "γονείς", "why": "Παίρνουμε το DNA μας από τους γονείς μας."}], "def": "Το μόριο που περιέχει τις «οδηγίες» για την ανάπτυξη και τη λειτουργία κάθε ζωντανού οργανισμού. Έχει σχήμα διπλής έλικας, σαν στριφογυριστή σκάλα, και βρίσκεται σχεδόν σε κάθε κύτταρο. Ένα κομμάτι DNA με οδηγίες για μια συγκεκριμένη πρωτεΐνη λέγεται γονίδιο. Το όνομα είναι συντομογραφία του «δεοξυριβονουκλεϊκό οξύ».", "ex": "Μοιάζεις στους γονείς σου επειδή πήρες το μισό DNA σου από τη μητέρα σου και το άλλο μισό από τον πατέρα σου.", "myth": {"wrong": "«Για κάθε χαρακτηριστικό υπάρχει ένα γονίδιο.»", "right": "Τα περισσότερα χαρακτηριστικά, όπως το ύψος, επηρεάζονται από πολλά γονίδια μαζί, αλλά και από το περιβάλλον, όπως η διατροφή."}, "fact": "Αν ξετύλιγες το DNA από ένα μόνο κύτταρό σου, θα είχε μήκος περίπου 2 μέτρα!", "quiz": {"q": "Τι σχήμα έχει το μόριο του DNA;", "a": ["Διπλή έλικα", "Σφαίρα", "Τετράγωνο"], "c": 0, "why": "Το DNA μοιάζει με σκάλα στριμμένη γύρω από τον εαυτό της: διπλή έλικα."}}, {"id": "B2-03", "sci": "bio", "lvl": 2, "word": "Οικοσύστημα", "en": "ecosystem", "taboo": [{"word": "φύση", "why": "Τα οικοσυστήματα είναι κομμάτια της φύσης."}, {"word": "ζώα", "why": "Τα ζώα είναι μέρος κάθε οικοσυστήματος."}, {"word": "φυτά", "why": "Τα φυτά είναι οι «παραγωγοί» της τροφής σε ένα οικοσύστημα."}, {"word": "περιβάλλον", "why": "Το οικοσύστημα περιλαμβάνει και το άβιο περιβάλλον: νερό, έδαφος, κλίμα."}, {"word": "τροφική αλυσίδα", "why": "Οι τροφικές αλυσίδες δείχνουν ποιος τρώει ποιον μέσα σε ένα οικοσύστημα."}], "def": "Μια περιοχή μαζί με όλους τους οργανισμούς που ζουν σε αυτήν (φυτά, ζώα, μύκητες, μικροοργα       <p><span class="tag ok">Σωστό</span>${esc(c.myth.right)}</p>
    </section>
    <section class="sec fact"><h2>Ήξερες ότι…</h2><p>${esc(c.fact)}</p></section>
    <section class="sec quiz" data-id="${c.id}">
      <h2>Δοκίμασε</h2>
      <p>${esc(c.quiz.q)}</p>
      <div class="opts">${c.quiz.a.map((a, i) => `<button type="button" class="opt" data-i="${i}"><b>${LETTERS[i]})</b><span>${esc(a)}</span></button>`).join("")}</div>
      <p class="feedback" aria-live="polite"></p>
    </section>
  </article>
  <div class="next"><a class="all" href="#">Όλες οι κάρτες</a></div>`;
}

function indexPage(missing) {
  const groups = Object.keys(SCI).map(k => {
    const s = SCI[k];
    const levels = [1, 2].map(l => {
      const list = CARDS.filter(c => c.sci === k && c.lvl === l);
      if (!list.length) return "";
      return `<p class="lvl"><span class="dots" aria-hidden="true">${"●".repeat(l)}</span>${LVL[l]}</p>
        <ul class="words">${list.map(c => `<li><a href="#${c.id}"><span>${esc(c.word)}</span><span class="code">${c.id}</span></a></li>`).join("")}</ul>`;
    }).join("");
    return `<section class="group" style="--ci:${s.ci}"><h2>${s.name}</h2>${levels}</section>`;
  }).join("");
  return `
  <header class="intro">
    <h1 tabindex="-1">Λέξη-Κλειδί</h1>
    <p>Σκάναρε το QR μιας κάρτας για να ανοίξει η σελίδα της, ή διάλεξε μια λέξη από τη λίστα.</p>
    ${missing ? `<p class="notice">Δεν υπάρχει κάρτα με κωδικό «${esc(missing)}». Έλεγξε τον κωδικό κάτω δεξιά στην κάρτα.</p>` : ""}
  </header>
  ${groups}`;
}

function route(focus) {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const card = id && CARDS.find(c => c.id.toLowerCase() === id.toLowerCase());
  app.innerHTML = card ? cardPage(card) : indexPage(id || "");
  window.scrollTo(0, 0);
  if (focus) app.querySelector("h1")?.focus();
}

app.addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (!opt) return;
  const box = opt.closest(".quiz");
  const c = CARDS.find(x => x.id === box.dataset.id);
  const pick = Number(opt.dataset.i);
  box.querySelectorAll(".opt").forEach((b, i) => {
    b.disabled = true;
    if (i === c.quiz.c) b.classList.add("right");
    else if (i === pick) b.classList.add("wrong");
  });
  box.querySelector(".feedback").innerHTML =
    (pick === c.quiz.c ? "<strong>Σωστά!</strong>" : "<strong>Όχι ακριβώς.</strong>") + esc(c.quiz.why);
});

window.addEventListener("hashchange", () => route(true));
route(false);
</script>

</html>
